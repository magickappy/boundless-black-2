<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boundless Black 2</title>
<meta name="description" content="Black 2, with every generation's Pokémon, modern mechanics, and a second region. Releases Nov 28th.">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15171c;color:#e6e8ec;
 font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;padding:40px 16px;text-align:center}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;margin:0 0 10px}
p{color:#9aa3b2;font-size:1.15rem;margin:0 0 24px}
.soon{display:inline-block;color:#5aa9ff;border:1px solid #5aa9ff;border-radius:999px;padding:4px 16px;font-weight:600;margin:0 0 28px}
img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #2e3440}
</style>
</head>
<body>
<main>
  <h1>Boundless Black 2</h1>
  <p>Black 2, with every generation's Pokémon, modern mechanics, and a second region</p>
  <span class="soon">Coming soon</span>
  <img src="screenshot.webp" alt="Undella Town, with Sprigatito following the player">
</main>
</body>
</html>
